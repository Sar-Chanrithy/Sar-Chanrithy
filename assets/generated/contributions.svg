<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img"><title>The contribution landscape</title><rect x="1" y="1" width="998" height="318" rx="16" fill="#0d1117" stroke="#293440"/><g font-family="Segoe UI,Arial,sans-serif"><text x="26" y="35" font-size="16" fill="#e6edf3" font-weight="600">The contribution landscape</text><text x="26" y="57" font-size="11" fill="#8b9aab" >An isometric view · height follows GitHub contribution intensity</text><text x="500" y="145" font-size="18" fill="#6ee7b7" text-anchor="middle">A year of small steps, rendered in 3D.</text><text x="500" y="174" font-size="13" fill="#8b9aab" text-anchor="middle">Contribution columns appear after the first sync.</text><text x="26" y="290" font-size="9" fill="#8b9aab" >LESS</text><rect x="61" y="280" width="11" height="11" rx="2" fill="#172a28"/><rect x="77" y="280" width="11" height="11" rx="2" fill="#205640"/><rect x="93" y="280" width="11" height="11" rx="2" fill="#27875a"/><rect x="109" y="280" width="11" height="11" rx="2" fill="#3dc981"/><rect x="125" y="280" width="11" height="11" rx="2" fill="#8cf0bb"/><text x="148" y="290" font-size="9" fill="#8b9aab" >MORE</text><text x="974" y="290" font-size="10" fill="#8b9aab" text-anchor="end">Each column is one day</text></g></svg>
